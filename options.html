<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">TabGuard - Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
      font-size: 24px;
    }

    .setting-group {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .setting-group:last-child {
      border-bottom: none;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #667eea;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .exclude-section h3 {
      color: #333;
      font-size: 16px;
      margin-bottom: 12px;
      margin-top: 5px;
    }

    .exclude-section p {
      color: #666;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      padding: 10px 16px;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #5568d3;
    }

    button:active {
      transform: scale(0.98);
    }

    button.remove-btn {
      background-color: #e74c3c;
      padding: 6px 12px;
      font-size: 12px;
    }

    button.remove-btn:hover {
      background-color: #c0392b;
    }

    .excluded-list {
      list-style: none;
      background: #f9f9f9;
      border-radius: 5px;
      padding: 10px;
    }

    .excluded-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: white;
      margin-bottom: 6px;
      border-radius: 4px;
      border-left: 3px solid #667eea;
    }

    .excluded-list li:last-child {
      margin-bottom: 0;
    }

    .excluded-list li span {
      color: #333;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      word-break: break-all;
    }

    .empty-message {
      color: #999;
      font-size: 13px;
      font-style: italic;
      padding: 10px;
      text-align: center;
    }

    .status-message {
      padding: 10px 12px;
      border-radius: 5px;
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status-message.show {
      display: block;
    }

    .status-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .info-box {
      background-color: #e7f3ff;
      border-left: 4px solid #667eea;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: #004085;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="settingsHeader">⚙️ TabGuard - Settings</h1>

    <div class="info-box" id="infoText">
      💡 Configure the plugin to your needs...
    </div>

    <div class="setting-group">
      <div class="toggle-container">
        <label class="toggle-label" id="enablePluginLabel">Enable plugin</label>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-group exclude-section">
      <h3 id="excludedDomainsLabel">🚫 Domains to exclude</h3>
      <p id="excludedDomainsDesc">Add domains where duplicate detection should not be applied...</p>

      <div class="input-group">
        <input type="text" id="domainInput" placeholder="e.g. gmail.com or *.example.com" />
        <button onclick="addDomain()" id="addBtn">Add</button>
      </div>

      <div id="statusMessage" class="status-message"></div>

      <ul id="excludedList" class="excluded-list">
        <li class="empty-message" id="noDomainsMsg">No excluded domains</li>
      </ul>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
